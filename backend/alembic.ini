# Alembic 설정.
#
# sqlalchemy.url 은 **일부러 비워 둔다.** env.py 가 app.config.settings.database_url
# (= 환경변수 DATABASE_URL) 을 읽는다. 접속 문자열을 이 파일에 적으면 시크릿이 커밋된다.
#
# 사용법:
#   env -u PYTHONPATH .venv/bin/alembic upgrade head     # 새 DB 에 스키마 생성
#   env -u PYTHONPATH .venv/bin/alembic stamp head       # 이미 스키마가 있는 DB 를 head 로 표시
#   env -u PYTHONPATH .venv/bin/alembic check            # 모델과 DB 사이의 드리프트 확인

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
